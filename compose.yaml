services:
  data-init:
    build: .
    user: "0:0"
    command: ["chown", "10001:10001", "/app/data"]
    volumes:
      - ./data:/app/data
    restart: "no"

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    volumes:
      - ./data:/app/data
    depends_on:
      data-init:
        condition: service_completed_successfully
    restart: "no"

  api:
    build: .
    init: true
    environment:
      PRODUCT_PROVIDER: "${PRODUCT_PROVIDER:-amazon_page}"
      MONITOR_MOCK_SCENARIO: "${MONITOR_MOCK_SCENARIO:-stable}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-21600}"
      FAILED_RETRY_SECONDS: "${FAILED_RETRY_SECONDS:-60}"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  worker:
    build: .
    command: ["python", "-m", "backend.worker"]
    init: true
    environment:
      PRODUCT_PROVIDER: "${PRODUCT_PROVIDER:-amazon_page}"
      MONITOR_MOCK_SCENARIO: "${MONITOR_MOCK_SCENARIO:-stable}"
      POLL_INTERVAL_SECONDS: "${POLL_INTERVAL_SECONDS:-21600}"
      FAILED_RETRY_SECONDS: "${FAILED_RETRY_SECONDS:-60}"
      QUEUE_GAP_SECONDS: "${QUEUE_GAP_SECONDS:-180}"
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from backend.worker import healthy; raise SystemExit(0 if healthy() else 1)"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
